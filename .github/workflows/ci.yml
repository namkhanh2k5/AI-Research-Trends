name: Offline research and web checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and web dependencies
        run: python -m pip install -e ".[dev,web,deliverables]"
      - name: Dependency integrity
        run: python -m pip check
      - name: Syntax check
        run: python -m compileall -q src dashboard deliverables tests
      - name: Artifact-handoff CLI contract (no private files)
        run: openalex-restore-local-artifact --help
      - name: Offline tests with published artifacts
        run: python -m pytest -q -ra -o addopts=''
      # Published research artifacts are tracked, with large files in Git LFS.
      - name: Exclude credentials from tracked files
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\.[^/]+)$' | grep -v -E '(^|/)\.env\.example$'; then
            echo "Credential file tracked" >&2
            exit 1
          fi
