decision: >-
  Independent two-rater human review is withdrawn from project scope. No rating
  was ever collected, and the 2025 temporal hold-out test no longer waits for
  human sign-off. The test runs exactly once on the frozen model.
withdrawn_requirements:
  - "human_review: pending_two_independent_real_raters"
  - two distinct human sign-offs and completed rating files before opening 2025
  - human scope approval of the 14-topic catalogue
unchanged_from_frozen_protocol:
  - model bundle, classes, feature rule and hyperparameters
  - rejection_threshold and confirmation_floor fitted on 2024 calibration only
  - evaluation_denominators and required_metrics
