[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-trends"
version = "0.1.0"
description = "Reproducible OpenAlex bibliometric study of AI research trends and scientific impact"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI Research Trends project team"}]
dependencies = [
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15,<22",
  "duckdb>=1.1,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
]
dev = [
  "pytest>=8,<9",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15,<22",
  "duckdb>=1.1,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "jupyterlab>=4,<5",
  "nbclient>=0.10,<1",
  "ipykernel>=6,<7",
]

[project.scripts]
openalex-validate-topics = "ai_research_trends.crawling.validate_topics:main"
openalex-collect-pilot = "ai_research_trends.crawling.collect_pilot:main"
openalex-collect-stratified = "ai_research_trends.crawling.collect_stratified:main"
openalex-collect-aggregates = "ai_research_trends.crawling.collect_aggregates:main"
openalex-plan-sample = "ai_research_trends.crawling.plan_stratified_sample:main"
openalex-profile-pilot = "ai_research_trends.crawling.profile_pilot:main"
openalex-discover-topics = "ai_research_trends.crawling.discover_topics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
