[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-trends"
version = "0.1.0"
description = "Reproducible OpenAlex bibliometric study of AI research trends and scientific impact"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI Research Trends project team"}]
dependencies = [
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15,<22",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
]
dev = [
  "pytest>=8,<9",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15,<22",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "jupyterlab>=4,<5",
  "nbclient>=0.10,<1",
  "ipykernel>=6,<7",
]
web = [
  "streamlit>=1.45,<2",
  "plotly>=5.24,<7.5",
]
deliverables = [
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
]
browser = [
  "playwright>=1.64,<2",
]

[project.scripts]
openalex-validate-topics = "ai_research_trends.crawling.validate_topics:main"
openalex-audit-categories = "ai_research_trends.crawling.audit_categories:main"
openalex-collect-pilot = "ai_research_trends.crawling.collect_pilot:main"
openalex-collect-stratified = "ai_research_trends.crawling.collect_stratified:main"
openalex-verify-collection = "ai_research_trends.crawling.verify_collection:main"
openalex-collect-aggregates = "ai_research_trends.crawling.collect_aggregates:main"
openalex-plan-sample = "ai_research_trends.crawling.plan_stratified_sample:main"
openalex-profile-pilot = "ai_research_trends.crawling.profile_pilot:main"
openalex-preprocess = "ai_research_trends.preprocessing.pipeline:main"
openalex-validate-processed = "ai_research_trends.preprocessing.validate_tables:main"
openalex-report-processed = "ai_research_trends.preprocessing.quality_report:main"
openalex-analyze-phase4 = "ai_research_trends.analysis.pipeline:main"
openalex-validate-phase4 = "ai_research_trends.analysis.validation:main"
openalex-publish-phase4-figures = "ai_research_trends.analysis.figure_publication:main"
openalex-publish-phase4-report = "ai_research_trends.analysis.report:main"
openalex-audit-literature = "ai_research_trends.ml.literature_audit:main"
openalex-verify-literature-audit = "ai_research_trends.ml.validate_literature_audit:main"
openalex-reassess-literature = "ai_research_trends.ml.candidate_pool:main"
openalex-enrich-candidates = "ai_research_trends.ml.metadata_enrichment:main"
openalex-diagnose-retrieval = "ai_research_trends.ml.retrieval_baselines:main"
openalex-pilot-topics = "ai_research_trends.ml.topic_pilot:main"
openalex-fetch-topic-metadata = "ai_research_trends.ml.topic_catalogue:main"
openalex-validate-topics-final = "ai_research_trends.ml.topic_final_validation:main"
openalex-verify-topic-run = "ai_research_trends.ml.validate_topic_run:main"
openalex-place-research-draft = "ai_research_trends.ml.topic_brief:main"
openalex-analyze-topic-annotations = "ai_research_trends.ml.topic_annotation:main"
openalex-discover-topics = "ai_research_trends.crawling.discover_topics:main"
openalex-audit-ml-gaps = "ai_research_trends.analysis.ml_data_gap:main"
openalex-audit-label-drift = "ai_research_trends.analysis.label_drift:main"
openalex-plan-ml-expansion = "ai_research_trends.crawling.ml_expansion_plan:main"
openalex-collect-ml-expansion = "ai_research_trends.crawling.collect_ml_expansion:main"
openalex-verify-ml-expansion = "ai_research_trends.crawling.verify_ml_expansion:main"
openalex-audit-ml-expansion = "ai_research_trends.preprocessing.ml_expansion_quality:main"
openalex-publish-ml-audit = "ai_research_trends.analysis.finalization_artifacts:main"
openalex-integrate-topics = "ai_research_trends.ml.integrate_topic_data:main"
openalex-verify-integrated-topics = "ai_research_trends.ml.validate_integrated_data:main"
openalex-analyze-rq6 = "ai_research_trends.analysis.rq6_topic_labels:main"
openalex-verify-rq6 = "ai_research_trends.analysis.validate_rq6:main"
openalex-prepare-human-review = "ai_research_trends.ml.human_review_workflow:main"
openalex-build-web-data = "ai_research_trends.analysis.web_data:main"
openalex-topic-population = "ai_research_trends.analysis.topic_population:main"
openalex-bind-finalization-p2 = "ai_research_trends.analysis.finalization_manifest:main"
openalex-final-ml = "ai_research_trends.ml.final_experiments:main"
openalex-final-open-set = "ai_research_trends.ml.final_open_set:main"
openalex-verify-final-ml = "ai_research_trends.ml.verify_final_ml:main"
openalex-package-topic-model = "ai_research_trends.ml.final_inference:main"
openalex-final-test = "ai_research_trends.ml.final_test_gate:main"
openalex-final-ml-figures = "ai_research_trends.analysis.final_ml_figures:main"
openalex-final-ml-diagnostics = "ai_research_trends.ml.final_diagnostics:main"
openalex-restore-local-artifact = "ai_research_trends.web.restore_artifacts:main"
openalex-paper-discovery = "ai_research_trends.web.paper_discovery:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
